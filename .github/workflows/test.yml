#

# One build job compiles everything inside the dev container once. Each test
# suite then runs as its own job on its own runner, using the build outputs and
# images of the build job. The suites come from `make suites`; `all-tests` is
# the single check to require.

name: FPC test
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_REGISTRY: 'ghcr.io'
  DOCKER_QUIET_BUILD: 1
  DOCKER_DEV_CI_MODE: 1
  DOCKER_BUILD_OPTS: '--build-arg UBUNTU_VERSION=22.04 --build-arg UBUNTU_NAME=jammy'
  # images the test jobs and the publish job need from the build job
  FPC_IMAGES: >-
    hyperledger/fabric-private-chaincode-dev:main
    hyperledger/fabric-private-chaincode-ccenv:main
    hyperledger/fabric-private-chaincode-base-dev:main

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: '**/go.sum'

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'utils/docker/**'
      - name: build base images
        if: steps.filter.outputs.docker == 'true'
        run: make -C utils/docker build build-dev
      - name: fetch base images
        if: steps.filter.outputs.docker == 'false'
        run: make -C utils/docker pull pull-dev
      - name: build dev image
        run: make -C utils/docker dev

      - name: build
        run: |
          mkdir -p "$HOME/.cache/go-build"
          make -C utils/docker run-dev DOCKER_DEV_SKIP_BUILD=1 \
            GOMODCACHE_PATH="$(go env GOMODCACHE)" GOCACHE_PATH="$HOME/.cache/go-build" \
            DOCKER_DEV_OPTIONAL_CMD='env IS_CI_RUNNING=true make build'

      # Everything the build produced is untracked; pack it as a tar so that
      # symlinks and executable bits survive the artifact upload. The dev
      # container ran as root and some outputs are 0600 keys, so pack with
      # sudo; the archive goes to RUNNER_TEMP so it never packs itself.
      - name: pack build outputs and images
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/artifact"
          git ls-files --others -z | sudo tar --null -T - -cf - | zstd -T0 -q -o "$RUNNER_TEMP/artifact/build.tar.zst"
          # shellcheck disable=SC2086
          docker save $FPC_IMAGES | zstd -T0 -q -o "$RUNNER_TEMP/artifact/images.tar.zst"
          ls -lh "$RUNNER_TEMP/artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: ${{ runner.temp }}/artifact
          retention-days: 1

      - name: list tests
        id: tests
        # the suites run in the dev container, which builds the C side
        run: echo "tests=$(FPC_CGO=1 make -s suites | jq -Rc 'split(" ") | ["unit"] + .')" >> "$GITHUB_OUTPUT"

  test:
    needs: build
    runs-on: ubuntu-22.04
    name: test (${{ matrix.test }})
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.build.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false
      # Each suite compiles other packages with other flags (-race, fpc_cgo,
      # coverage) than the build job, so it keeps its own Go cache instead of
      # the build job's. Only pushes (upstream: main) save it, and PRs read
      # main's, so PR branches don't fill the repo's cache quota with copies.
      - uses: actions/cache/restore@v6
        id: gocache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.test }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ matrix.test }}-
      - uses: actions/download-artifact@v8
        with:
          name: build
      # The checkout gave every tracked file a fresh mtime, newer than the
      # build outputs; backdate the tracked files so make and cmake see the
      # outputs as up to date instead of reconfiguring and rebuilding.
      - name: unpack build outputs and images
        run: |
          set -o pipefail
          git ls-files -z | xargs -0 touch -h -d @1
          git submodule foreach --recursive --quiet 'git ls-files -z | xargs -0 touch -h -d @1'
          zstd -dc build.tar.zst | tar -xf -
          zstd -dc images.tar.zst | docker load
          rm build.tar.zst images.tar.zst
          # the Fabric images (peer, orderer, ccenv, baseos, ca) that `make build`
          # pulled in the build job; pulling is faster than shipping them
          make -C fabric images

      - name: test
        run: |
          if [ "${{ matrix.test }}" = unit ]; then target='unit-test checks'; else target='suite-${{ matrix.test }}'; fi
          mkdir -p "$HOME/.cache/go-build"
          make -C utils/docker run-dev DOCKER_DEV_SKIP_BUILD=1 \
            GOMODCACHE_PATH="$(go env GOMODCACHE)" GOCACHE_PATH="$HOME/.cache/go-build" \
            DOCKER_DEV_OPTIONAL_CMD="env IS_CI_RUNNING=true make $target"
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && steps.gocache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # The Go side with only Go and Docker, as a developer without the SGX
  # toolchain has it (e.g. on a Mac): no dev container, no FPC_CGO.
  native:
    runs-on: ubuntu-latest
    name: native (${{ matrix.test }})
    strategy:
      fail-fast: false
      matrix:
        test: [unit, go_echo, go_auction, go_kv, go_simulation]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: '**/go.sum'
      - name: test
        run: |
          if [ "${{ matrix.test }}" = unit ]; then
            go build ./... && go vet ./... && go test ./... && make build test checks
          else
            make build suite-${{ matrix.test }}
          fi

  all-tests:
    needs: [test, native]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      # a result is 'skipped' if the build failed, 'failure' if any test
      # failed; only 'success' means every test ran and passed
      - name: check that every test passed
        run: '[ "${{ needs.test.result }}" = success ] && [ "${{ needs.native.result }}" = success ]'

  # Publish the base images only on push to main, only if they were rebuilt,
  # and only after every test passed.
  publish:
    needs: [build, all-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.docker == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: zstd -dc images.tar.zst | docker load
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make -C utils/docker publish
