# Docker Compose file for FPC Enclave Registry Chaincode (ERCC) containers

version: '2.1'

networks:
  fablo-network:
    external: true
    name: fablo_default

services:
  ercc.peer0.org1.example.com:
    container_name: ercc.peer0.org1.example.com
    image: fpc/ercc:${FPC_VERSION:-latest}
    environment:
      - CHAINCODE_PKG_ID=${ERCC_PKG_ID_ORG1}
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - FABRIC_LOGGING_SPEC=chaincode=debug:ercc=debug
      - CORE_CHAINCODE_ID_NAME=${ERCC_PKG_ID_ORG1}
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric-private-chaincode/ercc
    networks:
      - fablo-network
    restart: unless-stopped

  ercc.peer0.org2.example.com:
    container_name: ercc.peer0.org2.example.com
    image: fpc/ercc:${FPC_VERSION:-latest}
    environment:
      - CHAINCODE_PKG_ID=${ERCC_PKG_ID_ORG2}
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - FABRIC_LOGGING_SPEC=chaincode=debug:ercc=debug
      - CORE_CHAINCODE_ID_NAME=${ERCC_PKG_ID_ORG2}
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric-private-chaincode/ercc
    networks:
      - fablo-network
    restart: unless-stopped

