# Connection profile for Org2
# This file is used by the FPC client to connect to the Fabric network

name: "fpc-fablo-network-org2"
version: "1.0"

client:
  organization: Org2
  connection:
    timeout:
      peer:
        endorser: 300
      orderer: 300

channels:
  mychannel:
    orderers:
      - orderer0.group1.orderer.example.com
    peers:
      peer0.org1.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer0.org2.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true

organizations:
  Org1:
    mspid: Org1MSP
    peers:
      - peer0.org1.example.com

  Org2:
    mspid: Org2MSP
    peers:
      - peer0.org2.example.com
    certificateAuthorities:
      - ca.org2.example.com
    cryptoPath: ../target/fabric-config/crypto-config/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp

orderers:
  orderer0.group1.orderer.example.com:
    url: grpcs://localhost:7030
    grpcOptions:
      ssl-target-name-override: orderer0.group1.orderer.example.com
      grpc-max-send-message-length: 15
    tlsCACerts:
      path: ../target/fabric-config/crypto-config/ordererOrganizations/orderer.example.com/orderers/orderer0.group1.orderer.example.com/tls/ca.crt

peers:
  peer0.org1.example.com:
    url: grpcs://localhost:7041
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
      grpc.keepalive_time_ms: 600000
    tlsCACerts:
      path: ../target/fabric-config/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt

  peer0.org2.example.com:
    url: grpcs://localhost:7061
    grpcOptions:
      ssl-target-name-override: peer0.org2.example.com
      grpc.keepalive_time_ms: 600000
    tlsCACerts:
      path: ../target/fabric-config/crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt

certificateAuthorities:
  ca.org2.example.com:
    url: https://localhost:7040
    httpOptions:
      verify: false
    tlsCACerts:
      path: ../target/fabric-config/crypto-config/peerOrganizations/org2.example.com/ca/ca.org2.example.com-cert.pem
    registrar:
      - enrollId: admin
        enrollSecret: adminpw
    caName: ca.org2.example.com

# Made with Bob
